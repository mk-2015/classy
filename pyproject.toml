[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-classy" 
version = "1.3.0"
description = "A high-performance, functional asynchronous networking and security framework."
authors = [{ name="mk-2015", email="sxcyber17@gmail.com" }]
readme = "README.md"
requires-python = ">=3.8"  
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

dependencies = [
    "aiohttp>=3.9.0",
    "asyncpg>=0.29.0",
    "aiomysql>=0.2.0",
    "aiosqlite>=0.19.0",
    "colorama>=0.4.6"
]

[project.urls]
"Homepage" = "https://github.com/mk-2015/python-classy"
"Bug Tracker" = "https://github.com/mk-2015/python-classy/issues"